<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universe — Origins</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage-wrap" id="stage-wrap">
    <canvas id="stage" aria-label="Simulazione cronologica della nascita dell'universo: Big Bang, quark, gluoni e primi atomi">
      <p>Simulazione interattiva della formazione dei primi atomi dopo il Big Bang.</p>
    </canvas>

    <button
      type="button"
      id="btn-seed"
      class="particle-hitbox particle-hitbox--circle"
      aria-label="Innesca il Big Bang dalla singolarità bianca"
    ></button>
    <button
      type="button"
      id="btn-micro-continue"
      class="particle-hitbox"
      aria-label="Premi per fare zoom indietro verso la rete cosmica degli atomi"
      hidden
    ></button>
    <button
      type="button"
      id="btn-cosmic-next"
      class="particle-hitbox"
      aria-label="Premi per zoomare in un ammasso e osservare la nascita di una stella"
      hidden
    ></button>
    <button
      type="button"
      id="btn-star-next"
      class="particle-hitbox"
      aria-label="Premi per continuare dalla fusione nucleare nel nucleo stellare"
      hidden
    ></button>
  </main>

  <!-- Pannello segreto per la taratura in tempo reale (premi D per aprire/chiudere) -->
  <aside
    id="tuning-panel"
    class="tuning-panel"
    aria-label="Controlli parametri particelle"
    hidden
  >
    <div class="tuning-panel__header">
      <span class="tuning-panel__title">PARAMETRI</span>
      <button type="button" id="tuning-close" class="tuning-panel__close" aria-label="Chiudi pannello">D</button>
    </div>

    <div class="tuning-field">
      <div class="tuning-field__row">
        <label for="ctrl-count">Pallini</label>
        <output id="out-count" for="ctrl-count">3600</output>
      </div>
      <input type="range" id="ctrl-count" min="800" max="8000" step="100" value="3600">
    </div>

    <div class="tuning-field">
      <div class="tuning-field__row">
        <label for="ctrl-size">Dimensione</label>
        <output id="out-size" for="ctrl-size">1.8 px</output>
      </div>
      <input type="range" id="ctrl-size" min="0.8" max="4.5" step="0.1" value="1.8">
    </div>

    <div class="tuning-field">
      <div class="tuning-field__row">
        <label for="ctrl-magnet-radius">Raggio calamita</label>
        <output id="out-magnet-radius" for="ctrl-magnet-radius">145 px</output>
      </div>
      <input type="range" id="ctrl-magnet-radius" min="50" max="260" step="5" value="145">
    </div>

    <div class="tuning-field">
      <div class="tuning-field__row">
        <label for="ctrl-magnet-force">Forza calamita</label>
        <output id="out-magnet-force" for="ctrl-magnet-force">1.30</output>
      </div>
      <input type="range" id="ctrl-magnet-force" min="0.2" max="3.0" step="0.05" value="1.3">
    </div>

    <div class="tuning-panel__actions">
      <button type="button" id="ctrl-replay" class="tuning-btn">Riavvia Big Bang</button>
      <button type="button" id="ctrl-reset" class="tuning-btn tuning-btn--ghost">Default</button>
    </div>
  </aside>

  <script src="app.js" defer></script>
</body>
</html>
