<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HYDROGEN — Origin of Matter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage-wrap" id="stage-wrap">
    <canvas id="stage" aria-label="Storia dell'universo: Big Bang e atomo di Idrogeno formati da particelle">
      <h1>HYDROGEN</h1>
      <p>Simulazione interattiva del Big Bang, dell'atomo di idrogeno e dell'asse del tempo cosmico.</p>
    </canvas>

    <!-- Semantica accessibile e hit-area trasparenti sincronizzate con i nodi di particelle -->
    <h1 class="sr-only">HYDROGEN</h1>
    <button
      type="button"
      id="btn-seed"
      class="particle-hitbox particle-hitbox--circle"
      aria-label="Innesca il Big Bang dalla singolarità primordiale"
    ></button>
    <button
      type="button"
      id="btn-node-singularity"
      class="particle-hitbox particle-hitbox--circle"
      aria-label="Epoca 0: Singolarità — Riavvolgi le particelle al centro per ripetere il Big Bang"
      hidden
    ></button>
    <button
      type="button"
      id="btn-node-hydrogen"
      class="particle-hitbox particle-hitbox--circle"
      aria-label="Epoca 1: Idrogeno — Emetti un impulso energetico dall'atomo"
      hidden
    ></button>
  </main>

  <!-- Pannello segreto per la taratura in tempo reale (premi D per aprire/chiudere) -->
  <aside
    id="tuning-panel"
    class="tuning-panel"
    aria-label="Controlli parametri particelle"
    hidden
  >
    <div class="tuning-panel__header">
      <span class="tuning-panel__title">PARAMETRI</span>
      <button type="button" id="tuning-close" class="tuning-panel__close" aria-label="Chiudi pannello">D</button>
    </div>

    <div class="tuning-field">
      <div class="tuning-field__row">
        <label for="ctrl-count">Pallini</label>
        <output id="out-count" for="ctrl-count">4000</output>
      </div>
      <input type="range" id="ctrl-count" min="800" max="8000" step="100" value="4000">
    </div>

    <div class="tuning-field">
      <div class="tuning-field__row">
        <label for="ctrl-size">Dimensione</label>
        <output id="out-size" for="ctrl-size">1.9 px</output>
      </div>
      <input type="range" id="ctrl-size" min="0.8" max="4.5" step="0.1" value="1.9">
    </div>

    <div class="tuning-field">
      <div class="tuning-field__row">
        <label for="ctrl-brownian">Moto Browniano</label>
        <output id="out-brownian" for="ctrl-brownian">0.42</output>
      </div>
      <input type="range" id="ctrl-brownian" min="0" max="1.4" step="0.02" value="0.42">
    </div>

    <div class="tuning-field">
      <div class="tuning-field__row">
        <label for="ctrl-softness">Confini morbidi</label>
        <output id="out-softness" for="ctrl-softness">7 px</output>
      </div>
      <input type="range" id="ctrl-softness" min="0" max="24" step="1" value="7">
    </div>

    <div class="tuning-field">
      <div class="tuning-field__row">
        <label for="ctrl-magnet-radius">Raggio calamita</label>
        <output id="out-magnet-radius" for="ctrl-magnet-radius">145 px</output>
      </div>
      <input type="range" id="ctrl-magnet-radius" min="50" max="260" step="5" value="145">
    </div>

    <div class="tuning-field">
      <div class="tuning-field__row">
        <label for="ctrl-magnet-force">Forza calamita</label>
        <output id="out-magnet-force" for="ctrl-magnet-force">1.30</output>
      </div>
      <input type="range" id="ctrl-magnet-force" min="0.2" max="3.0" step="0.05" value="1.3">
    </div>

    <div class="tuning-panel__actions">
      <button type="button" id="ctrl-replay" class="tuning-btn">Riavvia Big Bang</button>
      <button type="button" id="ctrl-reset" class="tuning-btn tuning-btn--ghost">Default</button>
    </div>
  </aside>

  <script src="app.js" defer></script>
</body>
</html>
